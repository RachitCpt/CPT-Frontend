<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .logo-container {
            text-align: center;
            /* Center the logo */
            margin-bottom: 20px;
            /* Space between logo and form */
        }

        .login-logo {
            max-width: 150px;
            /* Set a smaller maximum width */
            height: auto;
            /* Maintain aspect ratio */
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <!-- Logo Container -->
        <div class="logo-container">
            <img src="./img/CPT.jpg" alt="Company Logo" class="login-logo">
        </div>

        <div class="row justify-content-center">
            <div class="col-md-4">
                <h2 class="text-center">Login</h2>
                <div class="alert alert-danger mt-3 d-none" id="error-message"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = form.email.value;
            const password = form.password.value;

            const res = await fetch('/api/user/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (data.status === 'success') {
                // Save token in localStorage
                localStorage.setItem('access_token', data.access);

                // Save employee name in localStorage
                localStorage.setItem('employee_name', data.employeeName);
                localStorage.setItem('employeeId', data.employeeId);

                console.log("DEBUG - token saved:", localStorage.getItem("access_token"));
                console.log("DEBUG - user saved:", localStorage.getItem("employee_name"));
                console.log("DEBUG - user employeeId saved:", localStorage.getItem("employeeId"));

                // Redirect
                window.location.href = 'dashboard_updated.html';
            } else {
                const errorEl = document.getElementById('error-message');
                errorEl.textContent = data.message;
                errorEl.classList.remove('d-none');
            }
        });



    </script>
</body>

</html>
